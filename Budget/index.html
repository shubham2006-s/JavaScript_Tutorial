<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Budget - Demo </title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="app" style="grid-template-columns: 380px 1fr;">
        <!-- SUMMARY LEFT SIDE -->
        <aside class="summary" style="display:flex;flex-direction:column;gap:22px;align-items:stretch;">

            <!-- AVAILABLE BUDGET -->
            <div class="card" style="padding:26px;text-align:center;">
                <div style="color:var(--muted);font-size:15px;margin-bottom:8px;">Available Budget</div>
                <div id="available" class="big" style="font-size:44px;">+2,345.64</div>
            </div>

            <!-- EXPENSE BAR (RED) -->
            <div
                style="background:var(--expense);border-radius:12px;padding:22px 18px;color:#fff;font-weight:700;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 10px rgba(0,0,0,0.3);">
                <div style="letter-spacing:1px;font-size:16px;">EXPENSES</div>
                <div id="expenseTotal" style="font-size:28px;font-weight:800;">-1,954.36</div>
                <div id="expensePercent" style="font-size:13px;opacity:0.85;">45%</div>
            </div>

            <!-- INCOME BAR (GREEN) -->
            <div
                style="background:var(--income);border-radius:12px;padding:22px 18px;color:#042;font-weight:700;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 10px rgba(0,0,0,0.3);">
                <div style="letter-spacing:1px;font-size:16px;">INCOME</div>
                <div id="incomeTotal" style="font-size:28px;font-weight:800;">+4,300.00</div>
            </div>

        </aside>

        <!-- INPUT + LIST RIGHT SIDE -->
        <div class="entries" style="min-height:620px;">
            <h2 style="text-align:center;font-size:22px;margin-bottom:16px">Reading Input Data</h2>

            <!-- SEPARATE INCOME + EXPENSES LISTS -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;">

                <!-- INCOME LIST -->
                <div>
                    <h3 class="section-title" style="color:var(--income);text-align:center;font-size:20px;">INCOME</h3>
                    <div class="list" id="incomeList" style="height:260px;"></div>
                </div>

                <!-- EXPENSE LIST -->
                <div>
                    <h3 class="section-title" style="color:var(--expense);text-align:center;font-size:20px;">EXPENSES
                    </h3>
                    <div class="list" id="expenseList" style="height:260px;"></div>
                </div>

            </div>

            <!-- FORM BELOW BOTH -->
            <form id="add" class="add-form" onsubmit="return false" style="margin-top:30px;">
                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
                <input id="desc" placeholder="Add description" />
                <input id="amount" placeholder="Value" inputmode="numeric" />
                <button id="addBtn">Add</button>
            </form>
        </div>
    </div>
    </div>

    <script src="./index.js"></script>
    // === SIMPLE BUDGET APP JS ===
</body>
</html>
